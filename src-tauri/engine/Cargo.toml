[package]
name = "nikki-engine"
version = "0.1.0"
description = "Nikki に同梱した LLM のエンジン（Ollama）を、このPCの中で起動・停止する部品"
edition = "2021"
publish = false

[lib]
name = "nikki_engine"
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# 確認用のプログラム（examples/smoke.rs）だけが使う
[dev-dependencies]
serde_json = "1"
