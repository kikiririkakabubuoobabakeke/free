[package]
name = "nikki"
version = "0.1.0"
description = "端末内に保存し、端末間で同期する日記アプリ"
edition = "2021"

[lib]
name = "nikki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# 自分のPC（LAN内）で動かしているLLMのサーバーと話すため。通信は画面側ではなくRust側で行う。
tauri-plugin-http = "=2.8.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
