name: アプリをビルド

# アプリに関わるファイルが変わるたびに全端末向けをビルドし、成果物として残す。
# v で始まるタグ（例: v0.1.0）を付けたときは、リリースを作ってそこにも置く。
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build.yml"

# 同じブランチのビルドは1つずつ。続けてpushしたときは、進行中のものを止めずに、最新の1件だけが順番を待つ。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Windows版・Mac版に同梱する LLM のエンジン（Ollama）の版。公式の配布物を、公開されているハッシュ値と照らしてから入れる。
  OLLAMA_VERSION: v0.35.1
  # 既定では同期なしのオフライン版を作る。同期つきの版にするには、
  # リポジトリの Settings → Secrets and variables → Actions → Variables に SYNC = on を登録する。
  VITE_SYNC: ${{ vars.SYNC }}
  # 同期先をアプリに埋め込む（任意・同期つきの版のみ）。設定しておくと、端末ごとに入力しなくて済む。
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
            engine: ollama-windows-amd64.zip
          - name: Mac
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            engine: ollama-darwin.tgz
          - name: Linux
            os: ubuntu-22.04
            engine: ""
            args: --bundles deb,appimage
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine
      - name: Linuxのビルドに必要なライブラリ
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: 同梱する LLM のエンジン（Ollama）を取ってくる
        if: matrix.engine != ''
        shell: bash
        env:
          ASSET: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          base="https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ASSET" "$base/$ASSET"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sha256sum.txt" "$base/sha256sum.txt"
          expected="$(grep -E "[ *](\./)?${ASSET}\$" "$RUNNER_TEMP/sha256sum.txt" | awk '{print $1}' | head -1)"
          [ -n "$expected" ] || { echo "::error::sha256sum.txt に $ASSET がありません"; exit 1; }
          # ファイル名を渡すと、Windows の「\」入りの場所では出力の頭に「\」が付くので、中身を標準入力から読ませる
          if command -v sha256sum > /dev/null; then
            actual="$(sha256sum < "$RUNNER_TEMP/$ASSET" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 < "$RUNNER_TEMP/$ASSET" | awk '{print $1}')"
          fi
          [ "$expected" = "$actual" ] || {
            echo "::error::$ASSET のハッシュ値が公開されているものと一致しません（公開: $expected / 取ってきたもの: $actual）"
            exit 1
          }
          echo "$ASSET のハッシュ値を確かめました: $actual"
          mkdir -p src-tauri/engine-dist/ollama
          case "$ASSET" in
            *.zip) 7z x -y -o"src-tauri/engine-dist/ollama" "$RUNNER_TEMP/$ASSET" > /dev/null ;;
            *.tgz) tar -xzf "$RUNNER_TEMP/$ASSET" -C src-tauri/engine-dist/ollama ;;
          esac
          ls -la src-tauri/engine-dist/ollama
          du -sh src-tauri/engine-dist/ollama
      - name: 同梱するエンジンが、この OS で動き、止めると子プロセスまで残らないことを確かめる
        if: matrix.engine != ''
        shell: bash
        run: |
          set -euo pipefail
          smoke() {
            cargo run --release --manifest-path src-tauri/engine/Cargo.toml --example smoke -- \
              src-tauri/engine-dist/ollama gemma3:270m,qwen2.5:0.5b "$@"
          }
          leftovers() {
            if [ "$RUNNER_OS" = "Windows" ]; then
              tasklist | grep -iE "ollama|llama-server" || true
            else
              pgrep -fl "engine-dist/ollama" || true
            fi
          }
          smoke
          sleep 2
          left="$(leftovers)"
          [ -z "$left" ] || { echo "::error::止めた後もプロセスが残っています"; echo "$left"; exit 1; }
          # アプリが止めずに終わった場合も、子プロセスまで一緒に終わること
          # （Windows はジョブオブジェクト、macOS は見張り役のおかげ）
          smoke crash
          sleep 3
          left="$(leftovers)"
          [ -z "$left" ] || { echo "::error::止めずに終わった後にプロセスが残っています"; echo "$left"; exit 1; }
          if [ "$RUNNER_OS" != "Windows" ]; then
            # アプリが強制終了された場合も、見張り役が止めること
            smoke wait > "$RUNNER_TEMP/smoke-wait.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 240); do grep -q "止めずに待ちます" "$RUNNER_TEMP/smoke-wait.log" && break; sleep 1; done
            grep -q "止めずに待ちます" "$RUNNER_TEMP/smoke-wait.log" || { cat "$RUNNER_TEMP/smoke-wait.log"; exit 1; }
            kill -9 "$pid"
            sleep 3
            left="$(leftovers)"
            [ -z "$left" ] || { echo "::error::強制終了の後にプロセスが残っています"; echo "$left"; exit 1; }
          fi
          echo "エンジンの確認がすべて通りました"
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: nikki-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Androidプロジェクトを生成
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init
          npx tauri icon src-tauri/app-icon.png
      - name: APKをビルド
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: APKに署名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 署名の鍵が毎回同じでないと、入れてあるアプリに上書きインストールできない。
          # 鍵が登録されていなければ、その場限りの鍵で署名する（上書き不可・入れ直しになる）。
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            KEYSTORE_PASSWORD=temporary
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" \
              -alias nikki -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nikki"
            echo "::warning::署名の鍵が未登録のため、その場限りの鍵で署名しました。このAPKは以前のものに上書きできません。READMEの「Androidの署名の鍵」を参照。"
          fi
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out nikki.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify nikki.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nikki-Android
          path: nikki.apk
          if-no-files-found: error

  ios:
    name: iPhone（未署名のipa）
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Xcodeプロジェクトを生成
        run: |
          npx tauri ios init
          npx tauri icon src-tauri/app-icon.png
      - name: 署名なしでビルド
        run: |
          # 署名は入れる側（SideStore や AltStore）が自分のApple IDで行うので、ここでは付けない。
          # 生成されたXcodeプロジェクトの全ビルド設定に「署名しない」を書き足す。
          perl -pi -e 's/buildSettings = \{/buildSettings = { CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/' \
            src-tauri/gen/apple/*.xcodeproj/project.pbxproj
          grep -c "CODE_SIGNING_ALLOWED = NO" src-tauri/gen/apple/*.xcodeproj/project.pbxproj
          # 最後の「書き出し」の段階は署名が無いと失敗するが、その手前でアプリ本体はできている。
          npx tauri ios build --target aarch64 || echo "::notice::書き出しの段階の失敗は想定どおり（署名なしのため）"
          app="$(find src-tauri/gen/apple -type d -path '*.xcarchive/Products/Applications/*.app' | head -1)"
          if [ -z "$app" ]; then echo "::error::アプリ本体ができていません"; exit 1; fi
          lipo -info "$app/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          mkdir Payload
          cp -R "$app" Payload/
          zip -qr nikki.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: nikki-iPhone
          path: nikki.ipa
          if-no-files-found: error

  release:
    name: リリースに置く
    # どれかの端末向けが失敗しても、できたものだけでリリースを作る
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
