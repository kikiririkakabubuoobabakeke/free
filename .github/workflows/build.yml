name: アプリをビルド

# アプリに関わるファイルが変わるたびに全端末向けをビルドし、成果物として残す。
# v で始まるタグ（例: v0.1.0）を付けたときは、リリースを作ってそこにも置く。
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 同期先をアプリに埋め込む（任意）。設定しておくと、端末ごとに入力しなくて済む。
  # リポジトリの Settings → Secrets and variables → Actions → Variables に登録する。
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - name: Mac
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,appimage
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linuxのビルドに必要なライブラリ
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: nikki-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Androidプロジェクトを生成
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init
          npx tauri icon src-tauri/app-icon.png
      - name: APKをビルド
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: APKに署名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 署名の鍵が毎回同じでないと、入れてあるアプリに上書きインストールできない。
          # 鍵が登録されていなければ、その場限りの鍵で署名する（上書き不可・入れ直しになる）。
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            KEYSTORE_PASSWORD=temporary
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" \
              -alias nikki -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nikki"
            echo "::warning::署名の鍵が未登録のため、その場限りの鍵で署名しました。このAPKは以前のものに上書きできません。READMEの「Androidの署名の鍵」を参照。"
          fi
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --out nikki.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify nikki.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nikki-Android
          path: nikki.apk
          if-no-files-found: error

  ios:
    name: iPhone（未署名のipa）
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Xcodeプロジェクトを生成
        run: |
          npx tauri ios init
          npx tauri icon src-tauri/app-icon.png
      - name: 署名なしでビルド
        run: |
          # 署名は入れる側（SideStore や AltStore）が自分のApple IDで行うので、ここでは付けない。
          npm run build
          project="$(ls -d src-tauri/gen/apple/*.xcodeproj)"
          scheme="$(xcodebuild -list -json -project "$project" | jq -r '.project.schemes[0]')"
          xcodebuild build -project "$project" -scheme "$scheme" -configuration release \
            -sdk iphoneos -arch arm64 -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R "$RUNNER_TEMP"/derived/Build/Products/release-iphoneos/*.app Payload/
          zip -qr nikki.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: nikki-iPhone
          path: nikki.ipa
          if-no-files-found: error

  release:
    name: リリースに置く
    # どれかの端末向けが失敗しても、できたものだけでリリースを作る
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
